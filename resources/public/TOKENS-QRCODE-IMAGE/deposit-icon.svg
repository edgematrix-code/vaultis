<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff87"/>
      <stop offset="0.5" stop-color="#00d66b"/>
      <stop offset="1" stop-color="#00a859"/>
    </linearGradient>
    <linearGradient id="barShadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#004d24" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#004d24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#003d1f"/>
      <stop offset="0.55" stop-color="#00a859"/>
      <stop offset="0.95" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#e6c46a"/>
    </linearGradient>
    <linearGradient id="coinRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#74817a"/>
      <stop offset="0.5" stop-color="#d4d8d2"/>
      <stop offset="1" stop-color="#8a9a93"/>
    </linearGradient>
    <radialGradient id="coinFace" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#333c38"/>
      <stop offset="1" stop-color="#1a1f1c"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="url(#bg)"/>

  <!-- Bar chart base stands -->
  <g opacity="0.22" fill="#87f0c4">
    <rect x="24" y="150" width="16" height="6" rx="2"/>
    <rect x="58" y="138" width="16" height="6" rx="2"/>
    <rect x="92" y="122" width="16" height="6" rx="2"/>
    <rect x="126" y="104" width="16" height="6" rx="2"/>
  </g>

  <!-- Bar columns -->
  <g>
    <!-- Column 1 -->
    <rect x="24" y="138" width="16" height="12" rx="3" fill="url(#bar)"/>
    <rect x="24" y="138" width="16" height="12" rx="3" fill="url(#barShadow)"/>
    <!-- Column 2 -->
    <rect x="58" y="126" width="16" height="24" rx="3" fill="url(#bar)"/>
    <rect x="58" y="126" width="16" height="24" rx="3" fill="url(#barShadow)"/>
    <!-- Column 3 -->
    <rect x="92" y="110" width="16" height="40" rx="3" fill="url(#bar)"/>
    <rect x="92" y="110" width="16" height="40" rx="3" fill="url(#barShadow)"/>
    <!-- Column 4 -->
    <rect x="126" y="92" width="16" height="58" rx="3" fill="url(#bar)"/>
    <rect x="126" y="92" width="16" height="58" rx="3" fill="url(#barShadow)"/>
  </g>

  <!-- Rising arrow -->
  <g>
    <!-- Arrow body (dark green to gold) -->
    <path
      d="M 32 150 L 140 42 L 168 70 L 56 166 Z"
      fill="url(#arrow)"
      stroke="#003a1c"
      stroke-width="2"
      stroke-linejoin="round"
    />
    <!-- Arrow highlight -->
    <path
      d="M 140 42 L 168 70 L 156 68 L 132 50 Z"
      fill="#f3e0a0"
      opacity="0.55"
    />
    <!-- Arrow lower shadow -->
    <path
      d="M 32 150 L 56 166 L 52 162 L 34 152 Z"
      fill="#002a15"
      opacity="0.7"
    />
  </g>

  <!-- Dollar coin (foreground, bottom right) -->
  <g>
    <!-- Rim -->
    <circle cx="150" cy="158" r="36" fill="url(#coinRim)" stroke="#3a463f" stroke-width="2"/>
    <!-- Rim texture lines -->
    <g stroke="#5c6b63" stroke-width="1" opacity="0.5" fill="none">
      <path d="M 150 122 a 36 36 0 0 1 0 72"/>
      <path d="M 150 122 a 36 36 0 0 0 0 72"/>
      <path d="M 114 158 a 36 36 0 0 1 72 0"/>
      <path d="M 114 158 a 36 36 0 0 0 72 0"/>
    </g>
    <!-- Face -->
    <circle cx="150" cy="158" r="28" fill="url(#coinFace)" stroke="#222a25" stroke-width="2"/>
    <!-- Dollar sign -->
    <text
      x="150"
      y="158"
      text-anchor="middle"
      dominant-baseline="central"
      font-family="Arial, Helvetica, sans-serif"
      font-size="32"
      font-weight="bold"
      fill="#ffffff"
    >
      $
    </text>
    <!-- Face shine -->
    <ellipse cx="142" cy="146" rx="10" ry="6" fill="#ffffff" opacity="0.08"/>
  </g>
</svg>
